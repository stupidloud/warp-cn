name: 构建 Windows 安装器

# warp-cn 中文优化分支 · Windows 构建工作流
# 构建目标: 仅产出 Windows 安装器 .exe（OSS 通道，无 Sentry）
# 触发方式: 手动触发 (workflow_dispatch)
# runner: windows-latest (已预装 MSVC + CMake)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '编译 profile (release=rlto 优化版, debug=开发版)'
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  WARP_BUILD_CHANNEL: oss
  TARGET: x86_64-pc-windows-msvc
  WIN_ARCH: x64
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: "8G"

jobs:
  build:
    name: 构建 warp-oss 安装器 (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 protoc
        shell: bash
        run: |
          mkdir -p $RUNNER_TEMP/protoc
          curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-win64.zip -o $RUNNER_TEMP/protoc.zip
          unzip -q $RUNNER_TEMP/protoc.zip -d $RUNNER_TEMP/protoc
          echo "$RUNNER_TEMP/protoc/bin" >> $GITHUB_PATH
      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ env.TARGET }}

      - name: 配置 sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: 安装 cargo-about
        run: cargo install --locked cargo-about@0.8.4

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
          }

          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $isccDir)) {
            throw "Inno Setup install directory not found: $isccDir"
          }
          $isccDir >> $env:GITHUB_PATH

      - name: 缓存 Rust 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            ~/.cargo/.package-cache
          key: rust-deps-win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-deps-win-

      - name: 构建 Windows 安装器
        id: bundle
        shell: pwsh
        run: |
          sccache --start-server

          $bundleArgs = @{
            CHANNEL = "${{ env.WARP_BUILD_CHANNEL }}"
            ARCH = "${{ env.WIN_ARCH }}"
            RELEASE_TAG = "warp-cn-oss-${{ github.run_id }}"
          }

          if ("${{ inputs.profile }}" -eq "debug") {
            $bundleArgs.DEBUG_BUILD = $true
          }

          & "${{ github.workspace }}\script\windows\bundle.ps1" @bundleArgs
          if ($LASTEXITCODE -ne 0) {
            throw "bundle.ps1 failed"
          }

          if (-not $env:GITHUB_OUTPUT) {
            throw "GITHUB_OUTPUT is not set"
          }

      - name: 输出 sccache 统计
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: warp-oss-windows-x64-installer-${{ inputs.profile }}
          path: ${{ steps.bundle.outputs.installer_path }}
          retention-days: 14
